spring.application.name=GaadiDealer


spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vms}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PWD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
file.upload-dir=src/main/resources/uploads



jwt.secret=${JWT_SECRET}
jwt.expiration=7200000

razorpay.api=${RAZORPAY_API_KEY}
razorpay.secretkey=${RAZORPAY_SECRET_KEY}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MailUserName}
spring.mail.password=${MailUserPassword}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

